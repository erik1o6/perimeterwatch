{% extends "base.html" %}
{% block title %}{{ status }} · {{ product }}{% endblock %}
{% block content %}
<div class="narrow">
  <div class="eyebrow">{{ product }}</div>
  <h1>{{ "Not found" if status == 404 else "That did not work" }}</h1>
  <p class="lede">{{ message }}</p>
  <p><a href="/targets">Back to your domains</a></p>
</div>
{% endblock %}
