{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9z"/>
{% elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.500 7l8.500 6 8.500-6"/>
{% elif name == "copy" %}<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
{% elif name == "code" %}<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>
{% elif name == "hexagon" %}<path d="M12 2.500l8.200 4.750v9.500L12 21.500l-8.200-4.750v-9.500z"/><path d="M12 12l8.200-4.750M12 12v9.500M12 12L3.800 7.250"/>
{% elif name == "radar" %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.400-6.400"/>
{% elif name == "server" %}<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01"/>
{% elif name == "shield" %}<path d="M12 3l7 3v5c0 4.500-3 8.300-7 10-4-1.700-7-5.500-7-10V6z"/><path d="M9 12l2 2 4-4"/>
{% elif name == "target" %}<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>
{% elif name == "lock" %}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{% elif name == "split" %}<rect x="3" y="4" width="7" height="16" rx="1.500"/><rect x="14" y="4" width="7" height="16" rx="1.500"/>
{% elif name == "download" %}<path d="M12 4v11M8 11l4 4 4-4M5 20h14"/>
{% elif name == "ban" %}<circle cx="12" cy="12" r="9"/><path d="M5.600 5.600l12.800 12.800"/>
{% endif %}
</svg>
{% endmacro %}
