[project]
name = "perimeterwatch"
version = "0.1.0"
description = "Opt-in monitoring of an organisation's own public attack surface, built for web3 teams."
authors = [
    { name = "code2142" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "httpx>=0.28",
    "dnspython>=2.7",
    "checkdmarc>=5.8",
    "dnstwist>=20250130",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "cryptography>=44",
    "jinja2>=3.1.5",
    "tldextract>=5.1",
    "tenacity>=9",
    "structlog>=24.4",
    "platformdirs>=4.3",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "eth-utils>=5",
    "eth-hash[pycryptodome]>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "websockets>=14",
    "ssh-audit==3.9.0",
]

[project.scripts]
pwatch = "perimeterwatch.cli.app:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' -q"
markers = [
    "live: touches the network; runs only against allowlisted domains the maintainer owns",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert is fine in tests and for invariants
    "E501",  # the formatter wraps code; long prose strings stay readable on one line
    "ASYNC109",  # timeouts are passed through to dnspython and httpx, which take them as arguments
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "ASYNC230", "ASYNC240"]
"src/perimeterwatch/migrations/**" = ["E", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["checkdmarc.*", "dnstwist.*", "tldextract.*"]
ignore_missing_imports = true
