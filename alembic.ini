# Used by maintainers to create migrations:
#   uv run alembic revision --autogenerate -m "describe the change"
# Applying migrations goes through `pwatch db migrate`, which needs no ini file.
[alembic]
script_location = src/perimeterwatch/migrations
sqlalchemy.url = sqlite:///./.alembic-scratch.db
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
